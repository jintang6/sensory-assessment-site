<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>领取感觉统合功能评估报告</title>
  <meta name="description" content="知衡感觉统合功能评估报告限时下载页。">
  <meta property="og:title" content="感觉统合功能评估报告">
  <meta property="og:description" content="请在链接有效期内领取 Word 评估报告。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="知衡">
  <link rel="stylesheet" href="./shared-report.css">
</head>
<body>
  <header class="page-header">
    <div class="header-inner">
      <div class="brand-mark" aria-hidden="true"><span>知</span><i></i></div>
      <div>
        <div class="brand-line"><strong>知衡</strong><span>感觉统合功能评估</span></div>
        <p>特殊教育学校 · 康复评估与目标制定</p>
      </div>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="pageTitle">
      <span class="eyebrow">限时报告文件</span>
      <h1 id="pageTitle">领取 Word 评估报告</h1>
      <p>此页面通过随机链接访问，报告到期后将无法继续下载。</p>
    </section>

    <section class="report-file" id="reportFile" aria-live="polite">
      <div class="word-icon" aria-hidden="true">W</div>
      <div class="file-copy">
        <span class="file-label">Microsoft Word 文档</span>
        <strong id="reportFilename">正在核验报告链接…</strong>
        <span id="reportExpiry">请稍候</span>
      </div>
      <a class="download-button" id="downloadReportBtn" href="#" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        下载 Word 报告
      </a>
    </section>

    <div class="state-message" id="stateMessage" role="status">
      <i aria-hidden="true"></i><span>正在安全读取报告信息</span>
    </div>

    <section class="privacy-band" aria-labelledby="privacyTitle">
      <div>
        <span class="eyebrow">隐私提示</span>
        <h2 id="privacyTitle">请仅在授权范围内使用</h2>
      </div>
      <p>报告可能包含学生个人与发展信息。请勿转发到无关群聊或公开平台，使用后及时删除本地文件。</p>
    </section>
  </main>

  <footer>
    <p>本报告基于学校场景功能性观察自动整理，不替代标准化量表、医学诊断或完整作业治疗评估。</p>
  </footer>

  <noscript>需要启用 JavaScript 才能核验并下载报告。</noscript>
  <script type="module" src="./shared-report.js"></script>
</body>
</html>
